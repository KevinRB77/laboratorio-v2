name: Este sera el workflow numero 
run-name: "${{GitHub.actor}} eta realizando la prueba para ete pipeline"
on:
  push:
    branches:
      - 'feature/**'

jobs:
  checkout-branch:
    runs-on: ubuntu-latest

    steps: 

    - name: checkout repo
      uses: actions/checkout@v4


    - name: Mostrar informacion del evento
      run: |
        echo "Repositorio: $GITHUB_REPOSITORY"
        echo "Rama: $GITHUB_REF"
        echo "Actor: $GITHUB_ACTOR"

    - name: Leer el archivo json
      id: read_json
      run: |
        VERSION=$(jq -r '.version' release.json) 
        ARTIFACT=$(jq -r '.artifact_name' release.json)

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT


    - name: Usar datos de json
      run: |  
        echo "Version detectada ${{steps.read_json.outputs.version}}"
  


